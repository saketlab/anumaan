- title: "Joint Bernoulli resistance-profile pipeline"
  desc: >
    Generic pipeline for estimating resistance-profile probability
    distributions from facility event-level AST data: a saturated
    log-linear joint Bernoulli model over the full 2^D state space, with
    exact marginalization of untested classes (no simulation or
    approximation). ONE joint model is fit across every configured
    stratum at once -- never a silent separate fit per stratum -- with
    shared (never stratum-indexed) interaction coefficients and the
    stratifier (hospital, state, district, country, or none) encoded as
    fixed effects in the covariate design via
    profile_build_fixed_effect_design(), a config-level choice, never
    hardcoded to "hospital". Covers the whole lifecycle: cohort selection,
    pre-fit assumption review, data-support screening, panel feasibility,
    prior predictive checks, Stan design and fitting, run monitoring,
    sampler/MCSE diagnostics, posterior predictive checks, held-out
    validation, final estimation with credible intervals, sensitivity
    analysis, simulation-based calibration, release reporting, and
    plotting.
  contents:
  - profile_select_cohort
  - profile_check_assumptions
  - profile_audit_support
  - profile_plan_precision
  - profile_define_cohort
  - profile_precision_bound
  - profile_check_panel_feasibility
  - profile_audit_interaction_support
  - profile_prepare_model_data
  - profile_summarize_cohort_eligibility
  - profile_enumerate_states
  - profile_interaction_design
  - profile_bernoulli_terms
  - profile_compatible_states
  - profile_build_fixed_effect_design
  - profile_build_design
  - profile_prior_predictive
  - profile_run_simulation_study
  - profile_fit_joint_bernoulli
  - profile_monitor_run
  - profile_check_sampler
  - profile_ppc
  - profile_validate_masked
  - profile_validate_heldout
  - profile_validate_newpatient
  - profile_validate_temporal
  - profile_estimate
  - profile_sensitivity
  - profile_sensitivity_scenarios
  - profile_release
  - profile_render_report
  - profile_aggregate_for_daly
  - profile_plot_calibration_forest
  - profile_plot_profile_heatmap
  - profile_plot_pairwise_heatmap

- title: "Pathway 2: Bayesian Profile Estimation"
  desc: >
    Bayesian hierarchical multivariate probit model for estimating resistance-profile
    distributions from facility-level AST data. Fits a Stan model (via cmdstanr)
    with zero or an arbitrary, user-declared number of named random-intercept blocks
    (see \code{prepare_random_effects()} -- e.g. hospital, patient, admission,
    or any other grouping the analysis layer declares; the package does not
    hardcode which blocks are scientifically appropriate for a given dataset).
    Use \code{random_effects = list()} for a fixed-effects-only model and
    supply \code{profile_group_col} when profiles are to be grouped.
    Two residual structures are supported: identity (default, no residual
    correlation) and correlated (full LKJ-Cholesky residual covariance).
    CPU and OpenCL backends are both supported as execution choices; backend
    selection changes compilation/sampling only, not the underlying model.
    Run once per pathogen; orchestrate across pathogens in the analysis repository.
  contents:
  - fit_bayesian_multivariate_probit
  - validate_compute_backend
  - prepare_random_effects
  - re_contribution
  - compute_event_profile_probabilities
  - assess_gibbs_profile_stability
  - aggregate_profiles_for_daly
  - summarize_fit_correlation_matrix
  - plot_omega_correlation_heatmap
  - plot_omega_convergence_heatmap
  - plot_omega_summary_table
  - plot_omega_degeneracy_diagnostic
  - plot_probit_fixed_effect_diagnostics
  - plot_probit_beta_family_diagnostics
  - plot_probit_worst_parameters
  - plot_probit_worst_offender_diagnostics

- title: "Pathway 2: Model Validation"
  desc: >
    Observed-versus-model calibration checks for a fitted Bayesian
    multivariate probit model -- a different question from profile
    estimation above ("does the fitted model reproduce the resistance
    patterns actually observed?" rather than "what is the observed-plus-
    imputed resistance profile?"). Kept as a distinct status
    (\code{profile_validation_status}) from sampler diagnostics. Gibbs
    profile-completion stability is a separate numerical status
    (\code{gibbs_stability_status}) assessed with
    \code{assess_gibbs_profile_stability()}.
  contents:
  - validate_marginal_calibration
  - validate_pairwise_calibration
  - validate_complete_profile_calibration
  - compute_profile_validation_status
  - mask_and_validate_ast

